name: Al-Mizan mathematical verification

on:
  push:
    paths:
      - 'research/verify_al_mizan.py'
      - '.github/workflows/al-mizan-verification.yml'
  pull_request:
    paths:
      - 'research/verify_al_mizan.py'
      - '.github/workflows/al-mizan-verification.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify conditional mathematical identities
        run: python research/verify_al_mizan.py
