]
keywords = [
  "10.5281/zenodo.23554838",
  "Ahmed EL BAHLOUL",
  "IMAM8MAHDI",
  "Al-Mizan",
  "ASTRO-Q°ODE",
  "OpenQASM 2.0",
  "27 Formes",
