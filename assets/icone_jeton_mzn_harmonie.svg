<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dégradés Cosmiques & Métalliques -->
    <radialGradient id="bgCosmique" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="45%" stop-color="#0F2027" />
      <stop offset="85%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <radialGradient id="orAlchimique" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="90%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6B4D00" />
    </radialGradient>

    <linearGradient id="orBordure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="75%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFF8DC" />
    </linearGradient>

    <radialGradient id="argentLunaire" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0E6ED" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="95%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <radialGradient id="haloEmeraudeMizan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#047857" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloOrCentre" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDF00" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FFB300" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0" />
    </radialGradient>

    <filter id="lueurOr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lueurEmeraude" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ombrePortee" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Chemin de texte circulaire supérieur -->
    <path id="cheminTexteHaut" d="M 140,512 A 372,372 0 1,1 884,512" fill="none" />
    <path id="cheminTexteBas" d="M 884,512 A 372,372 0 0,1 140,512" fill="none" />
  </defs>

  <!-- Fond Principal -->
  <circle cx="512" cy="512" r="510" fill="url(#bgCosmique)" />

  <!-- Anneau Externe de Gravure Monétaire -->
  <circle cx="512" cy="512" r="490" fill="none" stroke="url(#orBordure)" stroke-width="4" stroke-opacity="0.6" />
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#orBordure)" stroke-width="12" filter="url(#ombrePortee)" />
  <circle cx="512" cy="512" r="435" fill="none" stroke="url(#argentLunaire)" stroke-width="3" stroke-dasharray="6,8" stroke-opacity="0.7" />

  <!-- Couronne de Texte Monétaire Sacré -->
  <text fill="#FFD700" font-family="'Cinzel', 'Cinzel Decorative', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="bold" letter-spacing="9">
    <textPath href="#cheminTexteHaut" startOffset="50%" text-anchor="middle">
      ★ AL-MIZAN SOUVERAIN ★ MZN 313,000,000
    </textPath>
  </text>
  <text fill="#94A3B8" font-family="'Cinzel', 'Montserrat', 'Georgia', serif" font-size="22" font-weight="600" letter-spacing="6">
    <textPath href="#cheminTexteBas" startOffset="50%" text-anchor="middle">
      ANTI-RIBA • ZERO-FRICTION • DOI: 10.5281/ZENODO.23554838
    </textPath>
  </text>

  <!-- Anneau Interne d'Unisson Or (Au 79) & Argent (Ag 47) -->
  <circle cx="512" cy="512" r="395" fill="none" stroke="url(#orBordure)" stroke-width="6" stroke-opacity="0.8" />
  <circle cx="512" cy="512" r="380" fill="url(#bgCosmique)" fill-opacity="0.85" />
  <circle cx="512" cy="512" r="350" fill="url(#haloEmeraudeMizan)" filter="url(#lueurEmeraude)" />
  <circle cx="512" cy="512" r="280" fill="url(#haloOrCentre)" />

  <!-- Géométrie Sacrée : Les Cercles Harmoniques de l'Unisson -->
  <!-- 12 Méridiens Stellaires -->
  <g stroke="#FFD700" stroke-width="1" stroke-opacity="0.18">
    <line x1="512" y1="132" x2="512" y2="892" />
    <line x1="132" y1="512" x2="892" y2="512" />
    <line x1="243" y1="243" x2="781" y2="781" />
    <line x1="781" y1="243" x2="243" y2="781" />
  </g>

  <!-- Ellipses de la Sphère Holographique de Bloch -->
  <ellipse cx="512" cy="512" rx="290" ry="90" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="8,6" stroke-opacity="0.65" />
  <ellipse cx="512" cy="512" rx="90" ry="290" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="8,6" stroke-opacity="0.65" />
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#argentLunaire)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Étoiles de la Triade CPU - GPU - QPU -->
  <!-- Sommet Nord : QPU Cryogénique (22.5 mK) -->
  <g transform="translate(512, 190)">
    <circle cx="0" cy="0" r="14" fill="#00FFA3" filter="url(#lueurEmeraude)" />
    <polygon points="0,-16 5,-5 16,0 5,5 0,16 -5,5 -16,0 -5,-5" fill="#FFFFFF" />
    <text x="0" y="-22" fill="#00FFA3" font-family="'Montserrat', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">QPU 22.5mK</text>
  </g>

  <!-- Sommet Sud-Ouest : CPU Terrestre -->
  <g transform="translate(260, 680)">
    <circle cx="0" cy="0" r="12" fill="#FFD700" filter="url(#lueurOr)" />
    <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4" fill="#FFFFFF" />
    <text x="-2" y="26" fill="#FFD700" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">CPU TERRE</text>
  </g>

  <!-- Sommet Sud-Est : GPU Mobile Galaxy -->
  <g transform="translate(764, 680)">
    <circle cx="0" cy="0" r="12" fill="#94A3B8" />
    <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4" fill="#FFFFFF" />
    <text x="2" y="26" fill="#E2E8F0" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">GPU GALAXY</text>
  </g>

  <!-- LA BALANCE CÉLESTE D'AL-MIZAN EN ÉQUILIBRE PARFAIT -->
  <g filter="url(#ombrePortee)">
    <!-- Fléau Central Vertical (Axe de Justice) -->
    <path d="M 506,230 L 518,230 L 516,690 L 508,690 Z" fill="url(#orAlchimique)" filter="url(#lueurOr)" />
    <circle cx="512" cy="245" r="18" fill="url(#orAlchimique)" />
    <circle cx="512" cy="245" r="7" fill="#090A0F" />
    
    <!-- Pied d'Ancrage de la Balance (Base Pyramidale) -->
    <polygon points="432,710 592,710 572,670 452,670" fill="url(#orAlchimique)" />
    <rect x="412" y="710" width="200" height="12" rx="6" fill="url(#orBordure)" />
    <text x="512" y="700" fill="#141E30" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="3">MIZAN 0.6225</text>

    <!-- Fléau Horizontal Harmonique (Poutre de Pesée) -->
    <!-- Largeur = 440px (de x=292 à x=732), Parfaitement horizontal (Équilibre Absolu) -->
    <path d="M 282,336 L 512,324 L 742,336 L 742,348 L 512,342 L 282,348 Z" fill="url(#orAlchimique)" filter="url(#lueurOr)" />
    
    <!-- Pivot Central du Fléau avec Joyau Émeraude -->
    <circle cx="512" cy="336" r="26" fill="url(#orAlchimique)" />
    <circle cx="512" cy="336" r="16" fill="#00FFA3" filter="url(#lueurEmeraude)" />
    <circle cx="512" cy="336" r="6" fill="#FFFFFF" />

    <!-- Charnières et Fils de Suspension des Plateaux -->
    <!-- Côté Gauche (OR - 79) -->
    <circle cx="302" cy="342" r="8" fill="url(#orAlchimique)" />
    <line x1="302" y1="346" x2="242" y2="470" stroke="#FFD700" stroke-width="2.5" stroke-opacity="0.8" />
    <line x1="302" y1="346" x2="362" y2="470" stroke="#FFD700" stroke-width="2.5" stroke-opacity="0.8" />
    <!-- Plateau Gauche (Coupelle d'Or) -->
    <path d="M 222,470 C 222,520 382,520 382,470 Z" fill="url(#orAlchimique)" filter="url(#lueurOr)" />
    <ellipse cx="302" cy="470" rx="80" ry="14" fill="url(#orBordure)" />
    <!-- Pyramide de Lingots d'Or dans la Coupelle -->
    <polygon points="302,420 272,465 332,465" fill="#FFE57F" />
    <text x="302" y="462" fill="#6B4D00" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" text-anchor="middle">AU · 79</text>

    <!-- Côté Droit (ARGENT - 47) -->
    <circle cx="722" cy="342" r="8" fill="url(#orAlchimique)" />
    <line x1="722" y1="346" x2="662" y2="470" stroke="#E2E8F0" stroke-width="2.5" stroke-opacity="0.8" />
    <line x1="722" y1="346" x2="782" y2="470" stroke="#E2E8F0" stroke-width="2.5" stroke-opacity="0.8" />
    <!-- Plateau Droit (Coupelle d'Argent) -->
    <path d="M 642,470 C 642,520 802,520 802,470 Z" fill="url(#argentLunaire)" />
    <ellipse cx="722" cy="470" rx="80" ry="14" fill="#FFFFFF" />
    <!-- Pyramide d'Argent lunaire dans la Coupelle -->
    <polygon points="722,420 692,465 752,465" fill="#F8FAFC" />
    <text x="722" y="462" fill="#334155" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" text-anchor="middle">AG · 47</text>
  </g>

  <!-- BLASON CENTRAL : MONOGRAMME HARMONIQUE MZN SOUVERAIN -->
  <g transform="translate(512, 530)" filter="url(#ombrePortee)">
    <!-- Médaille Centrale Octogonale -->
    <polygon points="0,-72 51,-51 72,0 51,51 0,72 -51,51 -72,0 -51,-51" fill="#090A0F" stroke="url(#orBordure)" stroke-width="6" />
    <polygon points="0,-64 45,-45 64,0 45,45 0,64 -45,45 -64,0 -45,-45" fill="none" stroke="#00FFA3" stroke-width="2" stroke-opacity="0.8" />

    <!-- Inscription Calligraphique M Z N -->
    <text x="0" y="16" fill="url(#orAlchimique)" font-family="'Cinzel', 'Cinzel Decorative', 'Trajan Pro', serif" font-size="46" font-weight="bold" text-anchor="middle" letter-spacing="4" filter="url(#lueurOr)">
      MZN
    </text>
    <text x="0" y="38" fill="#00FFA3" font-family="'Montserrat', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="3">
      313M SOUVERAIN
    </text>
  </g>

  <!-- PACTE COMMERCIAL 50 / 50 & ZAKAT 2.5% EN BASE CIRCULAIRE -->
  <g transform="translate(512, 790)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#0F172A" stroke="url(#orBordure)" stroke-width="2" />
    <text x="0" y="6" fill="#FFD700" font-family="'Montserrat', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="3">
      ALLIANCE 50/50 • ZAKAT 2.5% • C=313
    </text>
  </g>

  <!-- Sceau de Clôture Souverain : Signature de l'Auteur -->
  <text x="512" y="860" fill="#64748B" font-family="'Cinzel', 'Montserrat', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="5">
    M. AHMED EL BAHLOUL • FONDATION PERPÉTUELLE
  </text>
</svg>
